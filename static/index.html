<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Veritas — Sourced Research Agent</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body { background-color: #090d16; color: #e2e8f0; font-family: 'Inter', system-ui, sans-serif; }
    .citation-badge {
      display: inline-flex; align-items: center; justify-content: center;
      background: rgba(56, 189, 248, 0.15); color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.4);
      font-size: 0.75rem; font-weight: 700; padding: 0 5px;
      border-radius: 4px; margin: 0 2px; cursor: pointer; text-decoration: none;
      transition: all 0.15s;
    }
    .citation-badge:hover { background: #38bdf8; color: #090d16; }
    .prose p { margin-bottom: 0.85rem; line-height: 1.7; }
    .prose ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 0.85rem; }
    .prose li { margin-bottom: 0.35rem; }
    .prose strong { color: #f8fafc; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Top Bar -->
  <header class="border-b border-slate-800/80 bg-slate-900/50 backdrop-blur sticky top-0 z-10">
    <div class="max-w-5xl mx-auto px-4 py-3.5 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-sky-400 to-indigo-600 flex items-center justify-center font-bold text-slate-950">V</div>
        <div>
          <h1 class="font-bold text-slate-100 leading-tight">Veritas Research Agent</h1>
          <p class="text-xs text-slate-400">Nebius Token Factory × Tavily Real-Time Search</p>
        </div>
      </div>
      <span class="text-xs px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">
        Verifiable Citations Active
      </span>
    </div>
  </header>

  <!-- Main Workspace -->
  <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-8">
    
    <!-- Search Input -->
    <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 shadow-xl">
      <form id="researchForm" class="flex flex-col sm:flex-row gap-3">
        <input
          id="questionInput"
          type="text"
          placeholder="Ask any complex research question requiring live, verifiable sources..."
          class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-sky-500 transition"
          required
        />
        <button
          id="submitBtn"
          type="submit"
          class="bg-sky-500 hover:bg-sky-400 text-slate-950 font-semibold px-6 py-3 rounded-xl transition flex items-center justify-center gap-2 shrink-0 cursor-pointer"
        >
          <span>Research</span>
        </button>
      </form>

      <!-- Quick Test Presets (Great for Demo Video) -->
      <div class="mt-3 flex flex-wrap items-center gap-2 text-xs text-slate-400">
        <span>Try:</span>
        <button type="button" onclick="setQuery('What are the key differences between Llama 3.3 70B and Qwen 2.5 72B in coding benchmarks?')" class="px-2.5 py-1 rounded-lg bg-slate-800/70 hover:bg-slate-800 text-slate-300 transition">
          Model Benchmarks
        </button>
        <button type="button" onclick="setQuery('How does Tavily search API optimize web retrieval for LLM agents?')" class="px-2.5 py-1 rounded-lg bg-slate-800/70 hover:bg-slate-800 text-slate-300 transition">
          Tavily Architecture
        </button>
        <button type="button" onclick="setQuery('What was the exact final score of the 2029 Mars Colonial Cup final?')" class="px-2.5 py-1 rounded-lg bg-amber-500/10 hover:bg-amber-500/20 text-amber-300 border border-amber-500/30 transition">
          Test Failure Case (No Evidence)
        </button>
      </div>
    </div>

    <!-- Loading Pipeline Trace -->
    <div id="loadingBox" class="hidden mt-8 bg-slate-900/60 border border-slate-800 rounded-2xl p-6">
      <div class="flex items-center gap-3 text-sky-400 font-medium">
        <svg class="animate-spin h-5 w-5" viewBox="0 0 24 24" fill="none">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
        </svg>
        <span id="loadingText">Step 1/3: Planning targeted search queries via Nebius Token Factory...</span>
      </div>
    </div>

    <!-- Results Grid -->
    <div id="resultsContainer" class="hidden mt-8 grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- Left 2 Cols: Agent Trace + Synthesized Answer -->
      <div class="lg:col-span-2 space-y-5">
        
        <!-- Agent Execution Trace -->
        <div class="bg-slate-900/70 border border-slate-800 rounded-xl p-4">
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Agent Query Plan</span>
            <span id="modelBadge" class="text-xs text-slate-500 font-mono"></span>
          </div>
          <div id="queriesList" class="flex flex-wrap gap-2"></div>
        </div>

        <!-- Answer Card -->
        <div id="answerCard" class="bg-slate-900/90 border border-slate-800 rounded-2xl p-6 shadow-lg">
          <h2 class="text-sm font-semibold uppercase tracking-wider text-sky-400 mb-4">Synthesized Research Answer</h2>
          <div id="answerContent" class="prose text-slate-200 text-base"></div>
        </div>
      </div>

      <!-- Right Col: Verifiable Sources -->
      <div class="space-y-4">
        <div class="flex items-center justify-between">
          <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-300">Verified Sources (<span id="sourceCount">0</span>)</h2>
          <span class="text-xs text-slate-500">Click to inspect</span>
        </div>
        <div id="sourcesList" class="space-y-3"></div>
      </div>

    </div>
  </main>

  <script>
    function setQuery(text) {
      document.getElementById('questionInput').value = text;
    }

    document.getElementById('researchForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const question = document.getElementById('questionInput').value.trim();
      if (!question) return;

      const btn = document.getElementById('submitBtn');
      const loadingBox = document.getElementById('loadingBox');
      const loadingText = document.getElementById('loadingText');
      const resultsContainer = document.getElementById('resultsContainer');

      btn.disabled = true;
      btn.classList.add('opacity-50');
      resultsContainer.classList.add('hidden');
      loadingBox.classList.remove('hidden');

      // Simulated step progress feedback
      loadingText.textContent = "Step 1/3: Planning targeted search queries via Nebius Token Factory...";
      const t1 = setTimeout(() => {
        loadingText.textContent = "Step 2/3: Retrieving & deduplicating live web sources via Tavily...";
      }, 1500);
      const t2 = setTimeout(() => {
        loadingText.textContent = "Step 3/3: Synthesizing grounded answer with inline citations...";
      }, 3500);

      try {
        const res = await fetch('/api/research', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question })
        });
        const data = await res.json();

        clearTimeout(t1);
        clearTimeout(t2);
        renderResults(data);
      } catch (err) {
        alert("Error running research agent: " + err.message);
      } finally {
        loadingBox.classList.add('hidden');
        btn.disabled = false;
        btn.classList.remove('opacity-50');
      }
    });

    function renderResults(data) {
      const resultsContainer = document.getElementById('resultsContainer');
      const queriesList = document.getElementById('queriesList');
      const answerContent = document.getElementById('answerContent');
      const answerCard = document.getElementById('answerCard');
      const sourcesList = document.getElementById('sourcesList');
      const sourceCount = document.getElementById('sourceCount');
      const modelBadge = document.getElementById('modelBadge');

      modelBadge.textContent = data.model_used || '';

      // Render planned queries
      queriesList.innerHTML = (data.planned_queries || []).map(q =>
        `<span class="text-xs px-2.5 py-1 rounded-md bg-slate-800 text-sky-300 border border-slate-700">🔍 ${escapeHtml(q)}</span>`
      ).join('');

      // Highlight insufficient evidence card border
      if (data.insufficient_evidence) {
        answerCard.classList.remove('border-slate-800');
        answerCard.classList.add('border-amber-500/60', 'bg-amber-950/10');
      } else {
        answerCard.classList.add('border-slate-800');
        answerCard.classList.remove('border-amber-500/60', 'bg-amber-950/10');
      }

      // Render Markdown answer and turn [1], [2] into clickable source links
      let html = marked.parse(data.answer || '');
      html = html.replace(/\[(\d+)\]/g, (match, num) => {
        const idx = parseInt(num, 10) - 1;
        const src = data.sources && data.sources[idx];
        if (src) {
          return `<a href="${src.url}" target="_blank" rel="noopener noreferrer" class="citation-badge" title="${escapeHtml(src.title)}">[${num}]</a>`;
        }
        return match;
      });
      answerContent.innerHTML = html;

      // Render Source Cards
      const sources = data.sources || [];
      sourceCount.textContent = sources.length;
      if (sources.length === 0) {
        sourcesList.innerHTML = `<div class="p-4 rounded-xl bg-slate-900/50 border border-slate-800 text-xs text-slate-400">No high-confidence sources passed the relevance filter.</div>`;
      } else {
        sourcesList.innerHTML = sources.map((s, i) => `
          <a href="${s.url}" target="_blank" rel="noopener noreferrer"
             class="block p-4 rounded-xl bg-slate-900/90 border border-slate-800 hover:border-sky-500/60 transition group">
            <div class="flex items-center justify-between gap-2 mb-1.5">
              <span class="text-xs font-bold px-2 py-0.5 rounded bg-sky-500/15 text-sky-400">[${i + 1}] ${escapeHtml(s.domain)}</span>
              <span class="text-[11px] text-slate-500">Score: ${s.score}</span>
            </div>
            <h3 class="text-sm font-medium text-slate-200 group-hover:text-sky-400 transition line-clamp-2 mb-1.5">
              ${escapeHtml(s.title)}
            </h3>
            <p class="text-xs text-slate-400 line-clamp-3 leading-relaxed">
              ${escapeHtml(s.content)}
            </p>
          </a>
        `).join('');
      }

      resultsContainer.classList.remove('hidden');
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }
  </script>
</body>
</html>
